# Files opened with kitty from the OS (Finder, `open`). kitty's own type guess
# misses these text formats, so its default "text/* in $EDITOR" rule skips them.
protocol file
ext qmd,rmd,r,R,lua,go,rs,jl,sql,ini,cfg,org,bib,cls,sty,diff,patch,adoc
action launch --type=os-window -- $EDITOR -- $FILE_PATH
