# Podman defaults on the Macs (hestia, noctua). Linux hosts run podman
# natively and need none of this; see docs/containers.md.
#
# These are the defaults `podman machine init` reads, not live settings:
# changing them affects the next machine created, not the running one.

[machine]
# 6 of the 10 cores, 8 GiB of the 24, 150 GiB sparse disk (grows as used).
cpus = 6
memory = 8192
disk_size = 150

# Rosetta instead of QEMU for linux/amd64 images. Much faster, and the
# reason amd64 is worth running locally at all. Apple Silicon + applehv only.
rosetta = true
