[preview]
max_width = 1920
max_height = 1080
image_quality = 50

[opener]
# Edit text files
edit = [{ run = 'nvim %s', block = true }]

# Open images (mpv on Linux, Preview on macOS)
image = [
  { run = 'mpv --image-display-duration=inf %s', orphan = true, desc = "Open image", for = "linux" },
  { run = 'open %s', orphan = true, for = "macos" },
]

# Open PDFs (zathura on Linux, Preview on macOS)
pdf = [
  { run = 'zathura %s', for = "linux" },
  { run = 'open %s', for = "macos" },
]

# Open videos
video = [{ run = 'mpv %s' }]

# Open office documents
office = [
  { run = 'onlyoffice-desktopeditors %s', orphan = true, for = "linux" },
  { run = 'open %s', orphan = true, for = "macos" },
]

[open]
# Rules for file types
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "image/*", use = "image" },
  { mime = "application/pdf", use = "pdf" },
  { mime = "video/*", use = "video" },
  { mime = "application/vnd.openxmlformats-officedocument.*", use = "office" },
  { mime = "application/vnd.oasis.opendocument.*", use = "office" },
  { mime = "application/msword", use = "office" },
  { mime = "application/vnd.ms-excel", use = "office" },
  { mime = "application/vnd.ms-powerpoint", use = "office" },
]
